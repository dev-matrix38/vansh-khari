<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Radiant Luxury Gold Gradient -->
    <radialGradient id="goldGradient" cx="50%" cy="45%" r="55%" fx="45%" fy="35%">
      <stop offset="0%" stop-color="#FFE853" />
      <stop offset="60%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#E5A600" />
    </radialGradient>
    
    <!-- Outer Rim Metallic Gradient -->
    <linearGradient id="rimGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="50%" stop-color="#D99B00" />
      <stop offset="100%" stop-color="#8C6300" />
    </linearGradient>

    <!-- Ruby Jewel Gradient -->
    <linearGradient id="rubyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3355" />
      <stop offset="70%" stop-color="#D90429" />
      <stop offset="100%" stop-color="#7A0012" />
    </linearGradient>

    <!-- Filter for soft shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#805500" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Circular Base with Gold Gradient -->
  <circle cx="256" cy="256" r="236" fill="url(#goldGradient)" stroke="url(#rimGradient)" stroke-width="12" filter="url(#shadow)" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#FFF7B2" stroke-width="3" stroke-opacity="0.8" />

  <!-- Royal Ruby Jewel Accent on Top -->
  <polygon points="256,90 280,122 256,138 232,122" fill="url(#rubyGradient)" />
  <polygon points="256,98 270,122 256,132 242,122" fill="#FFD700" opacity="0.85" />

  <!-- Monogram 'VK' in Deep Solid Black -->
  <text x="256" y="338" 
        font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" 
        font-size="210" 
        font-weight="900" 
        letter-spacing="-6" 
        text-anchor="middle" 
        fill="#0A0A0A" 
        style="text-shadow: 0 4px 10px rgba(180, 115, 0, 0.4);">
    VK
  </text>
</svg>
